[project]
name = "jobhunter"
version = "0.1.0"
description = "Cloud-only job collection foundation; see docs/PLAN.md for V0 scope."
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "feedparser>=6.0,<7",
    "google-auth>=2.40,<3",
    "gspread>=6.2,<7",
    "httpx>=0.28,<0.29",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.uv]
package = false
required-version = "==0.13.1"

