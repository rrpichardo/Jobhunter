[project]
name = "jobhunter"
version = "0.1.0"
description = "Cloud-only job collection foundation; see docs/PLAN.md for V0 scope."
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "feedparser>=6.0,<7",
    "google-auth>=2.40,<3",
    "gspread>=6.2,<7",
    "httpx>=0.28,<0.29",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# The logged-in social lane (docs/PLAN.md). Pinned exactly; installed only with `uv sync --extra social`.
# twscrape sends anonymous usage counts from its command line; scripts/x_collect.py turns that off.
social = [
    "twscrape==0.20.1",
    "playwright==1.64.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.uv]
package = false
required-version = "==0.13.1"

