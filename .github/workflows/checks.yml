name: Locked Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.1"
          python-version: "3.12"
      - name: Install the locked environment
        run: uv sync --locked
      - name: Verify runtime imports
        run: uv run --locked python -c "import bs4, feedparser, google.auth, gspread, httpx, yaml"
      - name: Run all current offline tests
        run: uv run --locked python -m pytest -q
