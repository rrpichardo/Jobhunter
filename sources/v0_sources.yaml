# V0 source registry. `candidate: true` boards are auto-probed guesses: a 404 drops them
# silently (kept as responders only). Tags are reviewed registry facts: ai | bigtech | other.
# Entries needing accounts or a labeled mailbox are never fetched here: they are recorded
# `needs setup` with the exact next action. `keyed_apis` are fetched once per run, only when
# their environment keys are set (otherwise `needs setup`). Adzuna is skipped (paid-only).
boards:
  greenhouse:
    - {board: anthropic, company: Anthropic, tag: ai}
    - {board: scaleai, company: Scale AI, tag: ai, candidate: true}
    - {board: databricks, company: Databricks, tag: ai, candidate: true}
    - {board: stripe, company: Stripe, tag: other, candidate: true}
    - {board: figma, company: Figma, tag: other, candidate: true}
    - {board: airbnb, company: Airbnb, tag: bigtech, candidate: true}
    - {board: coinbase, company: Coinbase, tag: other, candidate: true}
    - {board: instacart, company: Instacart, tag: other, candidate: true}
    - {board: datadog, company: Datadog, tag: other, candidate: true}
    - {board: cloudflare, company: Cloudflare, tag: other, candidate: true}
    - {board: reddit, company: Reddit, tag: bigtech, candidate: true}
    - {board: pinterest, company: Pinterest, tag: bigtech, candidate: true}
  lever:
    - {board: palantir, company: Palantir, tag: bigtech, candidate: true}
    - {board: spotify, company: Spotify, tag: bigtech, candidate: true}
    - {board: mistral, company: Mistral AI, tag: ai, candidate: true}
  ashby:
    - {board: openai, company: OpenAI, tag: ai, candidate: true}
    - {board: ramp, company: Ramp, tag: other, candidate: true}
    - {board: notion, company: Notion, tag: other, candidate: true}
    - {board: linear, company: Linear, tag: other, candidate: true}
    - {board: cohere, company: Cohere, tag: ai, candidate: true}
    - {board: perplexity, company: Perplexity, tag: ai, candidate: true}
    - {board: elevenlabs, company: ElevenLabs, tag: ai, candidate: true}
    - {board: sierra, company: Sierra, tag: ai, candidate: true}
    - {board: harvey, company: Harvey, tag: ai, candidate: true}
aggregators:
  - {id: remotive, kind: remotive, url: "https://remotive.com/api/remote-jobs?category=product&limit=50"}
  - {id: remoteok, kind: remoteok, url: "https://remoteok.com/api"}
  - {id: himalayas, kind: himalayas, url: "https://himalayas.app/jobs/api?limit=50"}
  - {id: jobicy, kind: jobicy, url: "https://jobicy.com/api/v2/remote-jobs?count=50&tag=product"}
  - {id: themuse, kind: themuse, url: "https://www.themuse.com/api/public/jobs?category=Product%20Management&page=0"}
  - {id: weworkremotely, kind: wwr, url: "https://weworkremotely.com/categories/remote-product-jobs.rss"}
keyed_apis:  # exactly one request per run each; keys come from environment variables and are never logged
  - id: jsearch
    kind: jsearch
    env: [JSEARCH_API_KEY]  # sent as the X-RapidAPI-Key header; free plan is 200 requests a month
    url: "https://jsearch.p.rapidapi.com/search-v2"  # /search was retired (HTTP 404, checked live)
    params: {query: "product manager in USA", page: 1, num_pages: 1, date_posted: week}
  - id: jooble
    kind: jooble
    env: [JOOBLE_API_KEY]  # appended to the URL path at request time, so the URL is never recorded
    url: "https://jooble.org/api"
    body: {keywords: "product manager", location: "United States", page: "1"}
detail_sources:  # listing page, then each shortlisted PM job's own page for its description (polite, capped)
  - {id: yc-product, kind: yc, url: "https://www.ycombinator.com/jobs/role/product-manager"}
  - {id: builtin-product, kind: builtin, url: "https://builtin.com/jobs/product-management"}
  - {id: waas-product, kind: waas, url: "https://www.workatastartup.com/jobs/l/product-manager"}  # public page, first ~24 jobs; needs an Accept: text/html header
  - {id: waas-operations, kind: waas, url: "https://www.workatastartup.com/jobs/l/operations"}  # chief of staff, founder in residence, strategy
  # a16z portfolio board: one search page (about 25 jobs) per entry, then each shortlisted job's own page
  - {id: a16z-product, kind: a16z, url: "https://jobs.a16z.com/jobs?q=product%20manager"}
  - {id: a16z-chief-of-staff, kind: a16z, url: "https://jobs.a16z.com/jobs?q=chief%20of%20staff"}
  - {id: a16z-strategy, kind: a16z, url: "https://jobs.a16z.com/jobs?q=strategy"}
  - {id: a16z-founder-in-residence, kind: a16z, url: "https://jobs.a16z.com/jobs?q=founder%20in%20residence"}
  - {id: getro-accel, kind: getro, url: "https://jobs.accel.com/jobs?q=product%20manager"}
  - {id: getro-primary, kind: getro, url: "https://jobs.primary.vc/jobs?q=product%20manager"}
listing_only:  # reachable and counted, but no description text yet, so nothing is delivered
  - {id: hn-who-is-hiring, kind: hn, url: "https://hn.algolia.com/api/v1/search_by_date?tags=story,author_whoishiring&hitsPerPage=3"}
needs_setup:
  - {id: linkedin-logged-in, env: [], action: "Create the dedicated LinkedIn account, log in locally, and supply its cookie in environment settings; Claude does not log in."}
  - {id: x-hiring-posts, env: [], action: "Create the dedicated X account and supply auth_token/ct0 cookies in environment settings."}
  - {id: gmail-job-alerts, env: [], action: "Forward alerts to the connected Gmail and add the JobHunter label filter; then verify the label."}
  - {id: nextplay-rss, env: [], action: "Record the verified Next Play feed URL, then enable RSS plus extraction."}
  - {id: alirohde-rss, env: [], action: "Public feed https://alirohdejobs.substack.com/feed (verified October 19). Run scripts.newsletter_collect, then the AI read step; recorded as needs setup until a validated result is passed to source_probe."}
  - {id: cosign, env: [], action: "cosign.com now redirects to a domain-parking page; the user supplies the correct Cosign URL and creates the account, then supplies session cookies in environment settings."}
  - {id: work-at-a-startup-logged-in, env: [], action: "OPTIONAL. The public pages (waas-product, waas-operations) are collected without a login but show only the first ~25 jobs of each role page; the full lists (about 240 product, 1,400 operations) need a logged-in session. To add them the user supplies session cookies in environment settings; not built."}
  - {id: mba-and-school-job-sites, env: [], action: "The user names each school or MBA site and its URL, creates or uses the logins, and supplies session cookies in environment settings; Claude never creates accounts or types passwords."}
